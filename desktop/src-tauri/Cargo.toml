[package]
name = "atlas-desktop"
# The app version comes from tauri.conf.json (package.json or ATLAS_VERSION), not from here.
version = "0.0.0"
description = "Atlas desktop companion"
authors = ["Signal Atlas"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
libc = "0.2"
getrandom = "0.3"
sha2 = "0.10"
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2.14.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tokio = { version = "1.54.0", features = ["time"] }
