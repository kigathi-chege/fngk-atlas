[package]
name = "atlas-desktop"
version = "0.1.0"
description = "Atlas desktop companion"
authors = ["Signal Atlas"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
libc = "0.2"
getrandom = "0.3"
sha2 = "0.10"
tauri-plugin-opener = "2.5.5"
