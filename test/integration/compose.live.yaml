services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: signal-live-test
    ports: ["${LIVE_BIND_HOST:-127.0.0.1}:${LIVE_POSTGRES_PORT}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signal"]
      interval: 1s
      timeout: 2s
      retries: 40
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${LIVE_BIND_HOST:-127.0.0.1}:${LIVE_REDIS_PORT}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 40
