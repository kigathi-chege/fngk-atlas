services:
  atlas:
    build: .
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      DOCKER_CONTAINER: "1"
      ATLAS_HOST: "0.0.0.0"
      ATLAS_PORT: "4317"
    volumes:
      - ./.atlas:/app/.atlas
      # Add read-only code roots explicitly when the container should inspect them:
      # - /workspace/signal:/workspace/signal:ro
